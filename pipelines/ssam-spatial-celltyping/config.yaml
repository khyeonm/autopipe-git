# ─────────────────────────────────────────────────────────────────────────────
# SSAM pipeline config — follows the canonical pnucolab/ssam workflow
# (github.com/pnucolab/ssam, docs/tldr.rst). Defaults match the reference values.
# ─────────────────────────────────────────────────────────────────────────────

# Spot table CSV path (inside container: /input/...)
csv: "/input/s3_spot_table.csv"

# KDE bandwidth in micrometers (canonical default: 2.5)
bandwidth: 2.5

# KDE grid spacing in micrometers per pixel (canonical default: 1.0).
# Increase (e.g. 2.0) for a coarser grid and lower memory on large tissues.
sampling_distance: 1.0

# Norm threshold for local-maxima detection.
# Leave empty ("") to use SSAM's canonical default, which run_kde derives from
# bandwidth: norm_threshold = 2 / (sqrt(2*pi) * bandwidth) ** 2  (~0.051 at bw=2.5).
# Set a number to override it (applied via analysis.set_thresholds).
norm_threshold: ""

# find_localmax search neighborhood size in pixels (canonical default: 3)
search_size: 3

# Leiden clustering resolution (canonical default: 0.6; higher -> more clusters)
resolution: 0.6

# filter_celltypemaps min_norm — background masking; drops cell-type pixels
# whose vector-field norm is below this (ssam default: 0.1)
min_norm: 0.1

# cluster_vectors outlier removal min_r (ssam default 0.8; negative disables outlier removal)
outlier_min_r: 0.3

# filter_celltypemaps min_r (ssam default 0.6)
filter_min_r: 0.3

# Run scale_vectors (per-gene standardization). Set false to skip scaling and
# reuse normalized vectors in its place (scaled_vectors := normalized_vectors).
scale_vectors: true

# Number of CPU threads
threads: 4
