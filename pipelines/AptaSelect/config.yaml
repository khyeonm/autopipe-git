# AptaSelect configuration.
# All library-design values are left blank — fill them in on the AutoPipe Input
# page before running. Nothing about the design is hard-coded in the Snakefile or
# script; the full insert length is derived automatically from these pieces.

# Required: paired-end R1 FASTQ (mounted at /input; .fq/.fastq or .gz)
r1: "/input/test_1.fq"
# Required: paired-end R2 FASTQ (mounted at /input; .fq/.fastq or .gz)
r2: "/input/test_2.fq"

# Required: left constant region (LCR) sequence — Stage 1 orientation anchor
lcr: "CCACTTCTCCTTCCATCCTAAAC"
# Required: right constant region (RCR) sequence — Stage 1 orientation anchor
rcr: "GAGTAGTTTGGAGGGTTGTCTG"
# Required: mismatch tolerance (max substitutions) for LCR/RCR matching in Stage 1
lcr_rcr_mismatch: "1"

# Required: short marker at the inner end of the LCR — Stage 2 exact match
left_marker: "TCCTAAAC"
# Required: short marker at the inner start of the RCR — Stage 2 exact match
right_marker: "GAGTAGTT"

# Required: left stem sequence — Stage 3 exact match (its length is derived)
left_stem: "TCTCTCTCTC"
# Required: right stem sequence — Stage 3 exact match (its length is derived)
right_stem: "GAGAGAGAGA"
# Required: exact target length of the random region N between the two stems
random_region_length: "22"